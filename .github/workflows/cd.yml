name: CD

# Deploys to production once the "Todo-app" CI workflow has finished
# successfully for a push to main, or on demand via workflow_dispatch.
#
# CI success (push to main)  -> build image -> push to GHCR -> deploy over SSH
#
# workflow_run does not support a `branches` filter, so the branch/event
# checks happen in each job's `if:` condition instead.
on:
  workflow_run:
    workflows: ["Todo-app"]
    types: [completed]
  workflow_dispatch: {}

# Prevent two production deploys from running at the same time. A newer run
# waits for the current one to finish rather than cancelling it mid-deploy.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      sha: ${{ steps.image.outputs.sha }}
    steps:
      - name: Checkout the commit CI passed on
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Resolve image reference
        id: image
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout the commit CI passed on
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Set up SSH
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy deployment files to the production host
        run: |
          set -eu
          ssh_opts="-i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o UserKnownHostsFile=~/.ssh/known_hosts"
          target="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          # shellcheck disable=SC2086
          ssh $ssh_opts "$target" "mkdir -p '${{ vars.DEPLOY_PATH }}'"
          # shellcheck disable=SC2086
          scp $ssh_opts \
            docker-compose.prod.yml \
            default.conf \
            deploy/deploy.sh \
            "$target:${{ vars.DEPLOY_PATH }}/"

      - name: Deploy and health-check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.sha }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -eu
          ssh_opts="-i ~/.ssh/deploy_key -p ${DEPLOY_PORT} -o UserKnownHostsFile=~/.ssh/known_hosts"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          # shellcheck disable=SC2086
          ssh $ssh_opts "$target" \
            "GHCR_USERNAME='${GHCR_USERNAME}' GHCR_TOKEN='${GHCR_TOKEN}' IMAGE='${IMAGE}' IMAGE_TAG='${IMAGE_TAG}' APP_URL='${APP_URL}' sh '${DEPLOY_PATH}/deploy.sh' '${DEPLOY_PATH}'"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
